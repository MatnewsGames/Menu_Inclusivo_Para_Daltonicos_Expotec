    <form id="myForm" action="inserir.php" method="POST">

        <h2>Preencha este breve formulário de feedback para que possamos garantir <br> uma experiência de alta qualidade
            para todos os nossos visitantes!</h2>

        <label for="name">Email:</label>
        <input type="email" id="name" name="name" required><br>

        <label for="question1">Qual parte você achou mais interessante?</label>
        <textarea id="question1" name="question1" required></textarea><br>

        <label for="question2">Qual parte você achou menos interessante?</label>
        <textarea id="question2" name="question2" required></textarea><br>

        <label for="question3">Digite a sua opinião geral:</label>
        <textarea id="question3" name="question3" required></textarea><br>

        <button type="submit">Enviar Feedback</button>
        <div class="message" id="confirmationMessage">
            Sua resposta foi enviada!
        </div>
        <br>
        <center>

            <div id="acessibilidade" onclick="toggleOpcoes()">
                <img src="../img/Protanopia/acessibilidadeprota.png" height="55" width="55" id="prota2">
                <img src="../img/Deuteranopia/acessibilidadedeute.png" height="55" width="55" id="deute2">
                <img src="../img/Tritanopia/acessibilidadetrita.png" height="55" width="55" id="trita2">
                <img src="../img/monocromacia/acessibilidademono.png" height="55" width="55" id="mono2">
                <img src="../img/acessibilidade.png" height="55" width="55" id="vinor2">
            </div>

            <div class="opcoes">
                <div class="config">
                    <div id="prota" class="opt" onclick="toggleProta()">
                        Protanopia
                    </div>

                    <div id="deute" class="opt" onclick="toggleDeute()">
                        Deuteranopia
                    </div>

                    <div id="trita" class="opt" onclick="toggleTrita()">
                        Tritanopia
                    </div>

                    <div id="mono" class="opt" onclick="toggleMono()">
                        Monocromacia
                    </div>

                    <div id="vinor" class="opt" onclick="toggleVinor()">
                        Visão Normal
                    </div>
                </div>
            </div>
        </center>

    <script>
        // Verifica se há um parâmetro na URL indicando sucesso de envio
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('enviado')) {
            document.getElementById('confirmationMessage').style.display = 'block';
        }

        document.getElementById("myForm").addEventListener("submit", function (event) {

            document.getElementById("confirmationMessage").style.display = "block"; // Mostra a mensagem
        });

        function toggleOpcoes() {
            const optDiv = document.querySelector('.opcoes');
            if (optDiv.style.display === 'none' || optDiv.style.display === '') {
                optDiv.style.display = 'block';
            } else {
                optDiv.style.display = 'none';
            }
        }

        // Função para remover todas as classes de acessibilidade
        function clearModes() {
            document.body.classList.remove("prota-mode", "deute-mode", "trita-mode", "mono-mode");
        }

        function toggleProta() {
            clearModes(); // Limpa as classes existentes
            document.body.classList.add("prota-mode"); // Adiciona a classe Protanopia
        }

        function toggleDeute() {
            clearModes(); // Limpa as classes existentes
            document.body.classList.add("deute-mode"); // Adiciona a classe Deuteranopia
        }

        function toggleTrita() {
            clearModes(); // Limpa as classes existentes
            document.body.classList.add("trita-mode"); // Adiciona a classe Tritanopia
        }

        function toggleMono() {
            clearModes(); // Limpa as classes existentes
            document.body.classList.add("mono-mode"); // Adiciona a classe Monocromacia
        }

        function toggleVinor() {
            clearModes(); // Remove todas as classes para voltar à visão normal
            document.body.classList.add("vinor-mode");
        }
    </script>
